[package]
name         = "signal-introspect"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-introspect"
description  = "Signal contract for Persona introspection query and projection envelopes."
publish      = false

[lib]
name = "signal_introspect"
path = "src/lib.rs"

[features]
default   = ["nota-text"]
nota-text = ["signal-frame/nota-text"]

[dependencies]
nota-next                = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main" }
signal-frame             = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-persona           = { git = "https://github.com/LiGoldragon/signal-persona.git", branch = "main", features = ["nota-text"] }
signal-message           = { git = "https://github.com/LiGoldragon/signal-message.git", branch = "main" }
triad-runtime            = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }
rkyv                     = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror                = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
